name: Android TV - Build APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_orbitGitHubClientId: ${{ vars.ORBIT_GITHUB_CLIENT_ID }}
      ORBIT_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate catalog and Python helpers
        run: |
          python3 scripts/catalog.py validate
          python3 -m unittest discover -s scripts/tests -v
      - name: Test, lint and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Package APK and SHA-256
        run: python3 scripts/ci_package.py debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: orbit-android-tv-debug
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test and lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: orbit-android-tv-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
